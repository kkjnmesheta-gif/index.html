<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-SmartGreen 7C Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Design Tokens ─────────────────────────────── */
    :root {
      --bg:           #f0faf4;
      --surface:      #ffffff;
      --border:       #d1fae5;
      --text:         #064e3b;
      --muted:        #6b7280;
      --accent:       #10b981;
      --grad-header:  linear-gradient(135deg, #064e3b, #065f46);
      --radius:       12px;
      --radius-sm:    8px;
      --shadow:       0 2px 8px rgba(0,0,0,.07), 0 4px 20px rgba(0,0,0,.05);
      --shadow-hover: 0 6px 18px rgba(0,0,0,.12), 0 12px 32px rgba(0,0,0,.08);
      --gap:          1.25rem;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      background: var(--bg);
      color: #1f2937;
      min-height: 100vh;
    }

    /* ── Header ────────────────────────────────────── */
    header {
      background: var(--grad-header);
      padding: 0 2rem;
      height: 70px;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(6,78,59,.4);
    }
    .header-logo { font-size: 1.8rem; line-height: 1; }
    .header-text { flex: 1; }
    .header-inst {
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(255,255,255,.65);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .header-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .header-year {
      background: rgba(255,255,255,.15);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.25);
    }

    /* ── Tab Navigation ────────────────────────────── */
    .tab-nav {
      background: #ffffff;
      border-bottom: 2px solid var(--border);
      display: flex;
      padding: 0 2rem;
      gap: 0;
    }
    .tab-btn {
      padding: 0.85rem 1.5rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .tab-btn:hover { color: var(--accent); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── Main ──────────────────────────────────────── */
    main { max-width: 1100px; margin: 0 auto; padding: 1.75rem 1.5rem 3rem; }

    .view { display: none; }
    .view.active { display: block; }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 0.9rem;
    }

    /* ── Summary Bar ───────────────────────────────── */
    #summary-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--gap);
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.1rem 1.3rem;
      border-left: 4px solid var(--accent);
    }
    .stat-card.karbon  { border-left-color: #6b7280; }
    .stat-card.proses  { border-left-color: #f59e0b; }
    .stat-card.overall { border-left-color: #6366f1; }
    .stat-value {
      font-size: 1.9rem;
      font-weight: 800;
      line-height: 1;
      color: #064e3b;
    }
    .stat-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    /* ── Cluster Cards Grid ────────────────────────── */
    #cluster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--gap);
    }
    .cluster-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform .2s, box-shadow .2s;
    }
    .cluster-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }
    .cluster-card-header {
      padding: 1rem 1.25rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .cluster-icon { font-size: 1.6rem; line-height: 1; }
    .cluster-name { font-size: 0.9rem; font-weight: 700; }
    .cluster-card-body { padding: 1rem 1.25rem 1.25rem; }

    .progress-wrap { margin-bottom: 0.75rem; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .progress-bar-bg {
      background: #e5e7eb;
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width .4s ease;
    }

    .count-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .count-pill {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }
    .pill-selesai  { background: #d1fae5; color: #065f46; }
    .pill-proses   { background: #fef3c7; color: #92400e; }
    .pill-belum    { background: #f3f4f6; color: #6b7280; }

    .status-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.22rem 0.7rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-ontrack    { background: #d1fae5; color: #065f46; }
    .badge-perhatian  { background: #fef3c7; color: #92400e; }
    .badge-kritikal   { background: #fee2e2; color: #991b1b; }

    /* ── Activity Tracker ──────────────────────────── */
    .tracker-toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .tracker-toolbar select,
    .tracker-toolbar input {
      padding: 0.5rem 0.85rem;
      border: 1.5px solid #d1d5db;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.85rem;
      color: #1f2937;
      background: #ffffff;
      outline: none;
      transition: border-color .15s;
    }
    .tracker-toolbar select:focus,
    .tracker-toolbar input:focus { border-color: var(--accent); }

    .btn {
      padding: 0.5rem 1.1rem;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover { opacity: .88; }
    .btn:active { transform: scale(.97); }
    .btn-green  { background: var(--accent); color: #ffffff; }
    .btn-red    { background: #ef4444; color: #ffffff; font-size: 0.75rem; padding: 0.3rem 0.7rem; }
    .btn-grey   { background: #e5e7eb; color: #374151; }

    /* ── Add Form ──────────────────────────────────── */
    #add-form-panel {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: none;
    }
    #add-form-panel.open { display: block; }
    #add-form-panel h3 {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #064e3b;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .form-field { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-field label { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .form-field input,
    .form-field select {
      padding: 0.5rem 0.75rem;
      border: 1.5px solid #d1d5db;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.85rem;
      color: #1f2937;
      background: #fff;
      outline: none;
    }
    .form-field input:focus,
    .form-field select:focus { border-color: var(--accent); }
    .form-actions { display: flex; gap: 0.5rem; }

    /* ── Table ─────────────────────────────────────── */
    .table-wrap {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.83rem;
    }
    thead tr {
      background: #f0fdf4;
      border-bottom: 2px solid var(--border);
    }
    th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      white-space: nowrap;
    }
    td {
      padding: 0.7rem 1rem;
      border-bottom: 1px solid #f3f4f6;
      color: #1f2937;
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f9fafb; }

    .status-select {
      padding: 0.25rem 0.5rem;
      border: 1.5px solid #d1d5db;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    .status-select.s-selesai { border-color: #10b981; color: #065f46; background: #d1fae5; }
    .status-select.s-proses  { border-color: #f59e0b; color: #92400e; background: #fef3c7; }
    .status-select.s-belum   { border-color: #d1d5db; color: #6b7280; background: #f9fafb; }

    .cluster-tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      color: #fff;
      white-space: nowrap;
    }

    .empty-row td {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
      font-style: italic;
    }

    /* ── Alert ─────────────────────────────────────── */
    #alert-box {
      display: none;
      position: fixed;
      top: 85px;
      right: 1.5rem;
      background: #1f2937;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 999;
      box-shadow: 0 4px 20px rgba(0,0,0,.2);
      max-width: 320px;
    }
  </style>
</head>

</header>

<nav class="tab-nav">

</nav>

<div id="alert-box"></div>

<main>
  <!-- ── FASA 1: DASHBOARD ── -->
  <div id="view-dashboard" class="view active">
    <p class="section-label">Ringkasan Pencapaian Keseluruhan</p>
    <div id="summary-bar"></div>
    <p class="section-label">Status Setiap Kluster</p>
    <div id="cluster-grid"></div>
  </div>

  <!-- ── FASA 2: ACTIVITY TRACKER ── -->
  <div id="view-tracker" class="view">
    <p class="section-label">Pengurusan Aktiviti</p>
    <div class="tracker-toolbar">
      <select id="filter-cluster" onchange="renderTracker()">
        <option value="all">🔍 Semua Kluster</option>
      </select>
      <button class="btn btn-green" onclick="toggleForm()">➕ Tambah Aktiviti</button>
    </div>

    <div id="add-form-panel">
      <h3>➕ Tambah Aktiviti Baru</h3>
      <div class="form-grid">
        <div class="form-field">
          <label>Kluster</label>
          <select id="f-cluster"></select>
        </div>
        <div class="form-field">
          <label>Tajuk Aktiviti</label>
          <input type="text" id="f-title" placeholder="Cth: Bengkel Kitar Semula" />
        </div>
        <div class="form-field">
          <label>PIC / Pegawai Bertanggungjawab</label>
          <input type="text" id="f-pic" placeholder="Nama pegawai" />
        </div>
        <div class="form-field">
          <label>Tarikh Pelaksanaan</label>
          <input type="date" id="f-date" />
        </div>
        <div class="form-field">
          <label>Status</label>
          <select id="f-status">
            <option value="Belum Mula">Belum Mula</option>
            <option value="Dalam Proses">Dalam Proses</option>
            <option value="Selesai">Selesai</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-green" onclick="addActivity()">💾 Simpan</button>
        <button class="btn btn-grey" onclick="toggleForm()">Batal</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>No.</th>
            <th>Kluster</th>
            <th>Tajuk Aktiviti</th>
            <th>PIC</th>
            <th>Tarikh</th>
            <th>Status</th>
            <th>Tindakan</th>
          </tr>
        </thead>
        <tbody id="tracker-tbody"></tbody>
      </table>
    </div>
  </div>
</main>

  }

  function loadData() {
    const saved = localStorage.getItem(LS_KEY);
    return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_DATA));
  }

  let appData = loadData();

  /* ════════════════════════════════════════════════
     HELPERS
  ════════════════════════════════════════════════ */
  function getCluster(clusterId) {
    return appData.find(c => c.id === clusterId);
  }

  function statusClass(status) {
    if (status === 'Selesai')     return 's-selesai';
    if (status === 'Dalam Proses') return 's-proses';
    return 's-belum';
  }

  function showAlert(msg, isError = false) {
    const box = document.getElementById('alert-box');
    box.textContent = msg;
    box.style.background = isError ? '#dc2626' : '#065f46';
    box.style.display = 'block';
    setTimeout(() => { box.style.display = 'none'; }, 3000);
  }

  function genId() {
    return 'x' + Math.random().toString(36).substr(2,8);
  }

  function formatDate(d) {
    if (!d) return '—';
    const [y,m,day] = d.split('-');
    return `${day}/${m}/${y}`;
  }

  /* ════════════════════════════════════════════════
     TAB NAVIGATION
  ════════════════════════════════════════════════ */
  function showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('view-' + viewId).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(b => {
      if (b.textContent.toLowerCase().includes(viewId === 'dashboard' ? 'dashboard' : 'tracker')) {
        b.classList.add('active');
      }
    });
    if (viewId === 'tracker') renderTracker();
    if (viewId === 'dashboard') renderDashboard();
  }

  /* ════════════════════════════════════════════════
     FASA 1 — DASHBOARD
  ════════════════════════════════════════════════ */
  function renderDashboard() {
    // Aggregate stats
    let totalSelesai = 0, totalProses = 0, totalBelum = 0;
    appData.forEach(c => {
      c.activities.forEach(a => {
        if (a.status === 'Selesai')      totalSelesai++;
        else if (a.status === 'Dalam Proses') totalProses++;
        else totalBelum++;
      });
    });
    const totalAktiviti = totalSelesai + totalProses + totalBelum;
    const overallPct = Math.round((totalSelesai / 35) * 100);

    document.getElementById('summary-bar').innerHTML = `
      <div class="stat-card">
        <div class="stat-value">35</div>
        <div class="stat-label">🎯 Jumlah Dirancang</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${totalSelesai}</div>
        <div class="stat-label">✅ Aktiviti Selesai</div>
      </div>
      <div class="stat-card proses">
        <div class="stat-value">${totalProses}</div>
        <div class="stat-label">🔄 Dalam Proses</div>
      </div>
      <div class="stat-card overall">
        <div class="stat-value">${overallPct}%</div>
        <div class="stat-label">📈 Pencapaian Keseluruhan</div>
      </div>
    `;

    // Cluster cards
    document.getElementById('cluster-grid').innerHTML = appData.map(c => {
      const selesai = c.activities.filter(a => a.status === 'Selesai').length;
      const proses  = c.activities.filter(a => a.status === 'Dalam Proses').length;
      const belum   = c.activities.filter(a => a.status === 'Belum Mula').length;
      const pct     = Math.round((selesai / 5) * 100);

      let badgeClass, badgeText;
      if (pct >= 70)      { badgeClass = 'badge-ontrack';   badgeText = '✅ On Track'; }
      else if (pct >= 40) { badgeClass = 'badge-perhatian'; badgeText = '⚠️ Perlu Perhatian'; }
      else                { badgeClass = 'badge-kritikal';  badgeText = '🔴 Kritikal'; }

      return `
        <div class="cluster-card">
          <div class="cluster-card-header" style="background:${c.gradient}">
            <span class="cluster-icon">${c.icon}</span>
            <span class="cluster-name">${c.name}</span>
          </div>
          <div class="cluster-card-body">
            <div class="progress-wrap">
              <div class="progress-meta">
                <span>${selesai} / 5 aktiviti selesai</span>
                <span>${pct}%</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width:${pct}%;background:${c.color}"></div>
              </div>
            </div>
            <div class="count-row">
              <span class="count-pill pill-selesai">✅ ${selesai} Selesai</span>
              <span class="count-pill pill-proses">🔄 ${proses} Dalam Proses</span>
              <span class="count-pill pill-belum">⬜ ${belum} Belum Mula</span>
            </div>
            <span class="status-badge ${badgeClass}">${badgeText}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  /* ════════════════════════════════════════════════
     FASA 2 — ACTIVITY TRACKER
  ════════════════════════════════════════════════ */
  function populateFilterDropdown() {
    const sel = document.getElementById('filter-cluster');
    // keep "Semua" option, rebuild the rest
    sel.innerHTML = '<option value="all">🔍 Semua Kluster</option>' +
      appData.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  }

  function populateFormCluster() {
    document.getElementById('f-cluster').innerHTML =
      appData.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  }

  function renderTracker() {
    const filterId = document.getElementById('filter-cluster').value;
    const tbody = document.getElementById('tracker-tbody');
    let rows = [];
    let no = 1;

    appData.forEach(c => {
      if (filterId !== 'all' && c.id !== filterId) return;
      c.activities.forEach(a => {
        rows.push({ cluster: c, activity: a, no: no++ });
      });
    });

    if (rows.length === 0) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="7">Tiada aktiviti ditemui.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(r => `
      <tr data-cid="${r.cluster.id}" data-aid="${r.activity.id}">
        <td>${r.no}</td>
        <td><span class="cluster-tag" style="background:${r.cluster.color}">${r.cluster.icon} ${r.cluster.name}</span></td>
        <td>${r.activity.title}</td>
        <td>${r.activity.pic}</td>
        <td>${formatDate(r.activity.date)}</td>
        <td>
          <select class="status-select ${statusClass(r.activity.status)}"
            onchange="updateStatus('${r.cluster.id}','${r.activity.id}',this.value,this)">
            <option ${r.activity.status==='Belum Mula'   ?'selected':''}>Belum Mula</option>
            <option ${r.activity.status==='Dalam Proses' ?'selected':''}>Dalam Proses</option>
            <option ${r.activity.status==='Selesai'      ?'selected':''}>Selesai</option>
          </select>
        </td>
        <td>
          <button class="btn btn-red" onclick="deleteActivity('${r.cluster.id}','${r.activity.id}')">🗑️ Padam</button>
        </td>
      </tr>
    `).join('');
  }

  function toggleForm() {
    const panel = document.getElementById('add-form-panel');
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) {
      document.getElementById('f-title').value = '';
      document.getElementById('f-pic').value   = '';
      document.getElementById('f-date').value  = '';
    }
  }

  function addActivity() {
    const clusterId = document.getElementById('f-cluster').value;
    const title     = document.getElementById('f-title').value.trim();
    const pic       = document.getElementById('f-pic').value.trim();
    const date      = document.getElementById('f-date').value;
    const status    = document.getElementById('f-status').value;

    if (!title || !pic || !date) {
      showAlert('⚠️ Sila lengkapkan semua medan.', true);
      return;
    }

    const cluster = getCluster(clusterId);
    if (cluster.activities.length >= 5) {
      showAlert(`⚠️ Kluster "${cluster.name}" telah mencapai had maksimum 5 aktiviti.`, true);
      return;
    }

    cluster.activities.push({ id: genId(), title, pic, date, status });
    saveData();
    renderTracker();
    renderDashboard();
    toggleForm();
    showAlert(`✅ Aktiviti berjaya ditambah ke ${cluster.name}.`);
  }

  function updateStatus(clusterId, activityId, newStatus, selectEl) {
    const cluster  = getCluster(clusterId);
    const activity = cluster.activities.find(a => a.id === activityId);
    activity.status = newStatus;
    selectEl.className = 'status-select ' + statusClass(newStatus);
    saveData();
    renderDashboard();
  }

  function deleteActivity(clusterId, activityId) {
    if (!confirm('Padam aktiviti ini? Tindakan tidak boleh dibuat alik.')) return;
    const cluster = getCluster(clusterId);
    cluster.activities = cluster.activities.filter(a => a.id !== activityId);
    saveData();
    renderTracker();
    renderDashboard();
    showAlert('🗑️ Aktiviti berjaya dipadamkan.');
  }

  /* ════════════════════════════════════════════════
     INIT
  ════════════════════════════════════════════════ */
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('header-year').textContent = new Date().getFullYear();
    populateFilterDropdown();
    populateFormCluster();
    renderDashboard();
  });
</script>

</body>
</html>
